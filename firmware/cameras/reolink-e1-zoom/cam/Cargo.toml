[package]
name = "cam"
edition.workspace = true
version.workspace = true
license.workspace = true
publish.workspace = true
default-run = "cam"

[[bin]]
name = "cam-launch"
path = "../image/cam-launch.rs"

[dependencies]
camera-transport = { path = "../../../crates/camera-transport" }
camera-control = { path = "../../../crates/camera-control" }
hdal = { path = "../hdal" }
libc = "0.2"
thiserror = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.9"
rumqttc = { version = "0.25.1", default-features = false }

[dev-dependencies]
hdal = { path = "../hdal", features = ["fake"] }
