name: Firmware checks
on:
  push:
    branches: ['**']
    paths: ['firmware/**', 'tools/mi-360/**', 'tools/reolink-e1-zoom/**', 'Makefile', '.github/workflows/**']
  pull_request:
    paths: ['firmware/**', 'tools/mi-360/**', 'tools/reolink-e1-zoom/**', 'Makefile', '.github/workflows/**']
permissions:
  contents: read
jobs:
  host:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Host compiler and Rust
        run: |
          sudo apt-get update
          sudo apt-get install -y clang llvm
          rustup toolchain install 1.95.0 --profile minimal --component rustfmt --component clippy --component rust-src
          rustup default 1.95.0
      - name: Pinned cross compiler
        run: |
          python3 firmware/scripts/fetch-zig.py
          echo "$GITHUB_WORKSPACE/firmware/.tools/zig" >> "$GITHUB_PATH"
      - name: Host gate
        run: make gate
      - name: Native builds without vendor SDK inputs
        run: |
          rustup target add --toolchain 1.95.0 armv7-unknown-linux-gnueabihf
          make -C firmware build-mi360 build-reolink
